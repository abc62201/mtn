<script>
  var 当前分类总游戏数=0;
  var rom列表;
  var 总游戏列表=[];
  var 每页显示数量=24;
  var 第几页=1;
  var 数据搜索="";

  var 文本定时器=null;

    var 键盘摇杆=await get_joytokey();

    joy_start(1);
    是否禁用键盘 = false;
    var 列表=await await get_classify_table();

    创建导航列表(导航列表数据);
    当前分类总游戏数 = await get_classify_game_no(webno);
    rom列表 = await 获取游戏列表(数据搜索, 每页显示数量, 第几页);
    创建游戏列表(rom列表);
    if (避免重复加载监听事件) {
      避免重复加载监听事件 = false;
      鼠标滚轮翻页();
      document.addEventListener('mousemove', (event) => {
          取消淡入();

      });

      视频定时器 = setInterval(function(){启动淡入定时器()}, 1000);

        await set_custom_dict("鼠标激活了窗口","1");
        await new Promise(resolve => setTimeout(resolve, 200));
        await mouse_click_ds(20,200);

      }
      document.addEventListener("click",async function(event){

      });

      搜索框.addEventListener("focus",async function(event){

</script>

  <script>
async function 创建导航列表(导航列表数据) {
  var 表长度=导航列表数据.length;
  var 当前分类是否存在=false;
  var 分类ul=document.getElementById("导航列表");
  for (var i = (0); i <= (表长度 - 1); i = i + (1)) {
    var 分类id=导航列表数据[i].id;
    if (分类id == webno) {
      当前分类是否存在 = true;

    }
  }
  if (!当前分类是否存在) {
    webno=导航列表数据[0].id;

  }
  for (var i = (0); i <= (表长度 - 1); i = i + (1)) {
    var 分类id=导航列表数据[i].id;
    var 分类名称=导航列表数据[i].daohang_name;
    var 分类图片路径=导航列表数据[i].daohang_img;
    var 分类li=document.createElement("li");
    var 分类图片=document.createElement("img");
    分类图片.className="导航图片";
    分类li.className="导航li";
    分类li.value=分类id;
    分类li.value1=i;
    分类图片路径 = ispath(分类图片路径);
    if (await check_file_exist(分类图片路径)) {
      分类图片.src=分类图片路径;
      分类li.appendChild(分类图片);

    } else {
      分类li.innerText=分类名称;

    }
    if (分类id == webno) {
      分类li.classList.add("导航被选中");
      激活的分类 = i;

    }
    分类li.addEventListener("click",async function(event){
      await change_theme(this.getAttribute("value"));

    });
    分类ul.appendChild(分类li);
  }
}
</script>

  <script>
async function 创建游戏列表(游戏列表) {
  var 表长度=游戏列表.length;
  var 游戏ul=document.getElementById("游戏列表ul");
  var 全部列表样式=document.querySelectorAll(".游戏列表li");
  var 全部列表样式长度=全部列表样式.length;
  总游戏列表.push(...游戏列表);
  for (var i = (0); i <= (表长度 - 1); i = i + (1)) {
    var 游戏id=游戏列表[i].id;
    var 游戏名称=游戏列表[i].game_name;
    var 游戏版本文本=游戏列表[i].game_ver;
    var 缩略图路径=游戏列表[i].game_thumb_path;
    var 游戏旗帜路径=游戏列表[i].national_flag;
    var 游戏li=document.createElement("li");
    var 游戏图片=document.createElement("img");
    var 游戏名图层=document.createElement("div");
    var 游戏图片图层=document.createElement("div");
    var 游戏副标题=document.createElement("div");
    var 游戏版本=document.createElement("p");
    var 游戏旗帜=document.createElement("img");
    游戏li.className="游戏列表li";
    游戏图片.className="导航图片";
    游戏名图层.className="游戏名图层";
    游戏图片图层.className="游戏图片图层";
    游戏副标题.className="游戏副标题";
    游戏旗帜.className="游戏旗帜";
    游戏li.value=游戏id;
    游戏li.setAttribute("value1",String((i + 全部列表样式长度)));
    缩略图路径 = ispath(缩略图路径);
    游戏旗帜路径 = ispath(游戏旗帜路径);
    游戏名图层.innerText=游戏名称;
    游戏版本.innerText=游戏版本文本;
    if (await check_file_exist(缩略图路径)) {
      游戏图片.src=缩略图路径;

    } else {
      游戏图片.src="";

    }
    if (await check_file_exist(游戏旗帜路径)) {
      游戏旗帜.src=游戏旗帜路径;

    } else {
      游戏旗帜.src=ispath("theme/national_flag/no_pic.png");

    }
    游戏li.addEventListener("click",async function(event){
      被选中的游戏列表项 = Number(this.getAttribute("value1"));
      选择的游戏id = Number(this.getAttribute("value"));
      选择游戏();

    });
    游戏li.addEventListener("dblclick",async function(event){
      启动游戏(this.getAttribute("value"));

    });
    游戏li.addEventListener("contextmenu",async function(event){
      被选中的游戏列表项 = Number(this.getAttribute("value1"));
      选择的游戏id = Number(this.getAttribute("value"));
      鼠标右键列表();
      选择游戏();

    });
    游戏图片图层.appendChild(游戏图片);
    游戏li.appendChild(游戏图片图层);
    游戏li.appendChild(游戏名图层);
    游戏副标题.appendChild(游戏版本);
    游戏副标题.appendChild(游戏旗帜);
    游戏li.appendChild(游戏副标题);
    游戏ul.appendChild(游戏li);
  }
}
</script>

async function 开始淡入() {
