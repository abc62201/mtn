<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta http-equiv="X-UA-Compatible" content="IE=Edge,chrome=1" />
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
<link rel="stylesheet" type="text/css" href="bootstrap/css/gamerom.css">
<link rel="stylesheet" type="text/css" href="bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="css/roast_toggle_btn.css">
<link rel="stylesheet" href="css/createDropdownMenu.css">
<script src="bootstrap/js/bootstrap.min.js"></script>
<script src="js/mtn_server.js"></script>
</head>
<body>
<div class="container-fluid">
        <div class="row">
          <div class="col-md-3" ondblclick="open_file('game_title_path')" oncontextmenu="open_path_window('game_title_path')">           
                <h5 class="text-center text-dark">标题图片</h5>
                <img id="img_title" src="" class="img-responsive border border-2 rounded img_title" alt="标题图片">                  
        </div>
        <div class="col-md-9">       
          <div class="row">
            <div class="col-md-3" ondblclick="open_file('game_cover_path')" oncontextmenu="open_path_window('game_cover_path')">            
              <h5 class="text-center text-dark">封面图片</h5>
              <img id="img_cover" src="" class="img-responsive border border-2 rounded img_title" alt="封面图片">                         
            </div>
            <div class="col-md-3" ondblclick="open_file('game_thumb_path')" oncontextmenu="open_path_window('game_thumb_path')">                     
              <h5 class="text-center text-dark">缩略图</h5>
              <img id="img_thumbnail" src="" class="img-responsive border border-2 rounded img_title" alt="缩略图">                       
            </div>
            <div class="col-md-3" ondblclick="open_file('game_screenshot_path')" oncontextmenu="open_path_window('game_screenshot_path')">            
              <h5 class="text-center text-dark">运行截图</h5>
              <img id="img_screenshot" src="" class="img-responsive border border-2 rounded img_title" alt="运行截图">        
            </div>
            <div class="col-md-3" ondblclick="open_file('game_logo_path')" oncontextmenu="open_path_window('game_logo_path')">            
              <h5 class="text-center text-dark">游戏logo</h5>
              <img id="img_logo" src="" class="img-responsive border border-2 rounded img_title" alt="游戏logo">        
            </div>
          </div>
        </div>
    </div>
    <div class="row">
      <div class="col-md-12">
		<button type="button" class="btn btn-default btn-lg bg-primary text-white" onclick="history.back()">后退</button>
		<button type="button" class="btn btn-default btn-lg bg-primary text-white" onclick="location_index1()">返回</button>
        <button type="button" class="btn btn-default btn-lg bg-primary text-white" onclick="open_file('ui_bj')" oncontextmenu="open_path_window('ui_bj')">更换背景图片</button>
        <button type="button" class="btn btn-default btn-lg bg-primary text-white" onclick="open_file('game_video_path')" oncontextmenu="open_path_window('game_video_path')">更新视频</button>
		<button type="button" class="btn btn-default btn-lg bg-primary text-white" onclick="open_file('game_magazine')" oncontextmenu="open_path_window('game_magazine')">更新游戏杂志</button>
		<button type="button" class="btn btn-default btn-lg bg-primary text-white" onclick="open_file('game_ips_path')" oncontextmenu="open_path_window('game_ips_path')">添加ips(游戏补丁)</button>
		<button type="button" class="btn btn-default btn-lg bg-primary text-white" onclick="run_game_rom()">运行游戏</button>
		<button type="button" class="btn btn-default btn-lg bg-primary text-white" onclick="up_game()">确定更新</button>
		<button type="button" class="btn btn-default btn-lg bg-primary text-white"onclick="up_game_data()" >上传游戏资料</button>
		<button type="button" class="btn btn-default btn-lg bg-primary text-white" onclick="previous_page()">上一个</button>
		<button type="button" class="btn btn-default btn-lg bg-primary text-white" onclick="next_page()">下一个</button>
	  </div>
	  <div class="col-md-12">
		<div class="progress" id="progress" style="display:none;;width: 30%;margin: 0 10px 0 10px;">
			<span id="up-progress" class="sr-only">0% 已完成</span>
		<div id="progress-bar"  style="height: 20px;width:0%;background-color: #5cb85c;"></div>
	  </div>
	</div>
    </div>  
	<div class="row">
		<div class="col-md-6" oncontextmenu="open_path_window('game_video_path')">
			<h5 class="text-center text-dark">游戏视频</h5>
			<video id="videoPreview" 
			class="border border-2 rounded" 
			width="100%" height="600px" src="" controls autoplay muted loop			
			>
		</div>
		<div class="col-md-6">
		<h5 class="text-center text-dark">游戏资料</h5>
		<div class="row">
		<div class="col-md-2 bg-light dashed-border text-muted">选择分类</div>
		<div class="col-md-4 bg-light dashed-border">
		<select id="game_classfly" class="form-select" aria-label="Default select example">
        </select>
		</div>		
		<div class="col-md-2 bg-light dashed-border text-muted">游戏名</div>
		<div id="game_name" class="col-md-4 bg-light dashed-border" contenteditable="true"
		onblur="add_table_text('game_name')"></div>		
		<div id="game_ver_txt" class="col-md-2 bg-light dashed-border text-muted">版本</div>
		<div id="game_ver" class="col-md-4 bg-light dashed-border" contenteditable="true"
		onblur="add_table_text('game_ver')"></div>	
		<div class="col-md-2 bg-light dashed-border text-muted">地区</div>
		<div class="col-md-4 bg-light dashed-border" data-bs-toggle="modal" data-bs-target="#modal_flag">
		<img id="flagImage" src="" class="national_flag">
		</div>
		<div id="game_score_txt" class="col-md-2 bg-light dashed-border text-muted">评分</div>
		<div id="game_score" class="col-md-4 bg-light dashed-border" contenteditable="true"
		onblur="add_table_text('game_score')"></div>		
		<div id="game_players_txt" class="col-md-2 bg-light dashed-border text-muted">游玩人数</div>
		<div id="game_players" class="col-md-4 bg-light dashed-border" contenteditable="true"
		onblur="add_table_text('game_players')"></div>	
		<div id="game_issuing_date_txt" class="col-md-2 bg-light dashed-border text-muted">发售日期</div>
		<div id="game_issuing_date" class="col-md-4 bg-light dashed-border" contenteditable="true"
		onblur="add_table_text('game_issuing_date')"></div>		
		<div id="game_developer_txt" class="col-md-2 bg-light dashed-border text-muted">开发商</div>
		<div id="game_developer" class="col-md-4 bg-light dashed-border" contenteditable="true"
		onblur="add_table_text('game_developer')"></div>	
		<div id="game_publisher_txt" class="col-md-2 bg-light dashed-border text-muted">发行商</div>
		<div id="game_publisher" class="col-md-4 bg-light dashed-border" contenteditable="true"
		onblur="add_table_text('game_publisher')"></div>		
		<div id="game_language_txt" class="col-md-2 bg-light dashed-border text-muted">游戏语言</div>
		<div id="game_language" class="col-md-4 bg-light dashed-border" contenteditable="true"
		onblur="add_table_text('game_language')"></div>	
		<div class="col-md-2 bg-light dashed-border text-muted">模拟器</div>
		<div class="col-md-4 bg-light dashed-border" data-bs-toggle="modal" data-bs-target="#modal_emu">
		<img id="emu_ico" src="" class="national_flag"  alt="">
		</div>
		<div class="col-md-2 bg-light dashed-border text-muted">模拟器核心</div>
		<div class="col-md-4 bg-light dashed-border" data-bs-toggle="modal" data-bs-target="#modal_core">
			<div id='emu_core'></div></div>
		<div id="game_type_txt" class="col-md-2 bg-light dashed-border text-muted">分类标签</div>
		<div id="game_type" class="col-md-4 bg-light dashed-border" contenteditable="true"
		onblur="add_table_text('game_type')"></div>		
		<div class="col-md-2 bg-light dashed-border text-muted">启动参数</div>
		<div id="emu_args" class="col-md-4 bg-light dashed-border" contenteditable="true"
		onblur="add_table_text('emu_args')" onclick="createDropdownMenu()">{emu}+ -L {core} -f +{gamefullpath}</div>
		<div class="col-md-2 bg-light dashed-border text-muted">rom路径</div>
		<div id="game_rom_path" class="col-md-10 bg-light dashed-border" 
		oncontextmenu="open_path_window('game_rom_path')"></div>		
		<div class="col-md-2 bg-light dashed-border text-muted">游戏补丁</div>
		<div id="game_ips_path" class="col-md-10 bg-light dashed-border" 
		ondblclick="open_file('game_ips_path')" oncontextmenu="open_path_window('game_ips_path')"></div>
		<div class="col-md-2 bg-light dashed-border text-muted">MD5值:</div>
		<div id="game_md5" class="col-md-10 bg-light dashed-border" ondblclick="dblclick_game_md5()" ></div>		
		<div class="col-md-12 bg-light dashed-border"> <h5 class="card-title">游戏简介</h5></div>
		<div id="game_intro_path" class="col-md-12 bg-dark text-light" contenteditable="true" 
		onblur="add_table_text('game_intro_path')" oncontextmenu="open_path_window('game_intro_path')"></div>
		</div>
		</div>
	</div>
     <div class="row">
            <div class="col-md-2" ondblclick="open_file('game_cassette_path')" oncontextmenu="open_path_window('game_cassette_path')">                     
              <h5 class="text-center text-dark">卡带</h5>
              <img id="img_cassette" src="" class="img-responsive border border-2 rounded img_title" alt="卡带">                        
            </div>
			<div class="col-md-2" ondblclick="open_file('game_circuit_path')" oncontextmenu="open_path_window('game_circuit_path')">                     
              <h5 class="text-center text-dark">电路板</h5>
              <img id="img_circuit" src="" class="img-responsive border border-2 rounded img_title" alt="电路板">                        
            </div>
			<div class="col-md-2" ondblclick="open_file('game_box_path')" oncontextmenu="open_path_window('game_box_path')">                     
              <h5 class="text-center text-dark">包装盒</h5>
              <img id="img_box" src="" class="img-responsive border border-2 rounded img_title" alt="包装盒">                        
            </div>
			<div class="col-md-2" ondblclick="open_file('game_poster_path')" oncontextmenu="open_path_window('game_poster_path')">                     
              <h5 class="text-center text-dark">海报宣传画</h5>
              <img id="img_poster" src="" class="img-responsive border border-2 rounded img_title" alt="海报宣传画">                        
            </div>
			<div class="col-md-2" ondblclick="open_file('game_role_paht')" oncontextmenu="open_path_window('game_role_paht')">                     
              <h5 class="text-center text-dark">游戏角色</h5>
              <img id="img_role" src="" class="img-responsive border border-2 rounded img_title" alt="游戏角色">                        
            </div>  
			<div class="col-md-2" ondblclick="open_file('game_ico')" oncontextmenu="open_path_window('game_ico')">                     
				<h5 class="text-center text-dark">软件图标</h5>
				<img id="game_ico" src="" class="img-responsive border border-2 rounded img_title" alt="软件图标">                        
			  </div>                                          
      </div>
	  <div  class="row">
		<div class="col-md-12" oncontextmenu="open_path_window('game_magazine')">                     
		   <h5 class="text-center text-dark">游戏杂志</h5>
		   <object id="pdf_magazine" type="application/pdf" data="" width="100%" height="800px"></object> 
	  </div>
	 </div>
<!-- 模态框 -->  
<div class="modal fade" id="modal_flag" tabindex="-1" aria-labelledby="modal_flag" aria-hidden="true">  
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">  
    <div class="modal-content">  
      <div class="modal-header">  
        <h5 class="modal-title" id="centeredScrollableModalLabel">选择国旗</h5>  
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>  
      </div>  
      <div class="modal-body">  
		<div class="container-fluid">
			<div class="row">
				<div class="col-md-3">
				<img src="../../../theme/national_flag/cn.png" class="img-thumbnail rounded flag-option" style="height: 64px;" alt="中国">
				</div>
				<div class="col-md-3">
				<img src="../../../theme/national_flag/jp.png" class="img-thumbnail rounded flag-option" style="height: 64px;" alt="日本">
				</div>
				<div class="col-md-3">
				<img src="../../../theme/national_flag/eu.png" class="img-thumbnail rounded flag-option" style="height: 64px;" alt="欧洲">
				</div>
				<div class="col-md-3">
				<img src="../../../theme/national_flag/wd.jpeg" 
				class="img-thumbnail rounded flag-option" style="height: 64px;" alt="世界">
				</div>
				</div>
			
				<div class="row">
				<div class="col-md-3">
				<img src="../../../theme/national_flag/us.png" class="img-thumbnail rounded flag-option" style="height: 64px;" alt="美国">
				</div>
				<div class="col-md-3">
				<img src="../../../theme/national_flag/mf.png" class="img-thumbnail rounded flag-option" style="height: 64px;" alt="法国">
				</div>
				<div class="col-md-3">
				<img src="../../../theme/national_flag/as.png" class="img-thumbnail rounded flag-option" style="height: 64px;" alt="亚洲">
				</div>
				<div class="col-md-3">
				<img src="../../../theme/national_flag/kr.png" class="img-thumbnail rounded flag-option" style="height: 64px;" alt="韩国">
				</div>
				</div>
				<div class="row">
				<div class="col-md-3">
				<img src="../../../theme/national_flag/br.png" class="img-thumbnail rounded flag-option" style="height: 64px;" alt="巴西">
				</div>
				<div class="col-md-3">
				<img src="../../../theme/national_flag/gb.png" class="img-thumbnail rounded flag-option" style="height: 64px;" alt="英国">
				</div>
				<div class="col-md-3">
				<img src="../../../theme/national_flag/au.png" class="img-thumbnail rounded flag-option" style="height: 64px;" alt="澳大利亚">
				</div>
				<div class="col-md-3">
				<img src="../../../theme/national_flag/ru.png" class="img-thumbnail rounded flag-option" style="height: 64px;" alt="俄罗斯">
				</div>
				</div>
		</div>
      <div class="modal-footer">  
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>    
      </div>  
    </div>  
  </div>  
</div>  
</div>
<div class="modal fade" id="modal_emu" tabindex="-1" aria-labelledby="modal_emu" aria-hidden="true"> 
	<div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
	 <div class="modal-content"> 
	  <div class="modal-header">
	   <h5 class="modal-title" id="emu_title">选择模拟器</h5>
	   <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>   
	  </div>
	  <div class="modal-body">
	   <div class="container-fluid">
		<div id="emu_row" class="row">
		</div>
	   </div>
	  </div>
	  <div class="modal-footer">  
	   <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
	   <button type="button" class="btn btn-secondary" id="emu_clear" onclick="emu_clear()">清空模拟器</button>
	  </div>
	 </div>
	</div>
   </div>
</div>  
<div class="modal fade" id="modal_core" tabindex="-1" aria-labelledby="modal_core" aria-hidden="true"> 
	<div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
	 <div class="modal-content"> 
	  <div class="modal-header">
	   <h5 class="modal-title" id="core_title">选择模拟器核心</h5>
	   <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>   
	  </div>
	  <div class="modal-body">
	   <div class="container-fluid">
		<div id="core_row" class="row">
		
		</div>
	   </div>
	  </div>
	  <div class="modal-footer">  
	   <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
		<button type="button" class="btn btn-secondary" id="core_clear" onclick="core_clear()">清空核心</button>
	  </div>
	 </div>
	</div>
   </div>
   <div id="myDropdown" class="dropdown-content"></div>
<script src="js/web_js.js"></script>
<script src="js/game_set_txt.js"></script>
<script src="js/roast_toggle_btn.js"></script>
<script>

</script>

</body>
</html>
